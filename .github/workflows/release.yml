name: Release

# Build and publish on version tags (e.g. v0.1.0), or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building version $v"

      - name: Build dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/goroot_*_linux_amd64
            dist/goroot_*_linux_arm64

  npm:
    name: Publish to GitHub Packages (npm)
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          registry="https://npm.pkg.github.com"
          cd npm/goroot-installer
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${VERSION}" version --registry "$registry" >/dev/null 2>&1; then
            echo "already published: ${name}@${VERSION}"
            exit 0
          fi
          npm publish --registry "$registry"
